# Alembic configuration. The database URL is NOT stored here:
# migrations/env.py reads MIGRATION_DATABASE_URL (owner / migration role) from the environment or .env.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# Without this Alembic splits prepend_sys_path on ":" and a Windows path like D:\softs\... is cut after the drive
# letter. "os" = split on os.pathsep (";" on Windows, ":" elsewhere). Needs Alembic >= 1.16.
path_separator = os
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
